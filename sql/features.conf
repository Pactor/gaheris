# Which migrations belong to which feature.
#
# Read by install.sh. One record per line:
#
#     name | depends on | migration numbers
#
# Numbers are applied in numeric order regardless of how they are listed here,
# because order matters: the bulk imports at 46 and 89-92 overwrite anything
# earlier, so a correction numbered above them must run after them.
#
# Anything not listed in any feature is treated as part of `base`, so a new
# migration is applied by default rather than silently dropped. Add it to a
# feature only when it genuinely belongs to one.

# ---------------------------------------------------------------- foundation

# The co-operative conversion itself, the world fixes, and everything that has
# no meaning on its own. Every other feature depends on it.
base | - | 1 3 4 7 8 9 10 21 22 27 31 32 38 41 56 62 69 77 78 104 116 117

# Getting around: the travel catalogue, Gate Wardens, portals and zone points.
travel | base | 5 11 14 16 24 25 26 28 29 30 97

# ------------------------------------------------------------------- content

# New Frontiers: population, objects, crossings, border keeps and the way home.
frontiers | base travel | 48 49 50 51 60 61 63 64 65 70 71 72

# The designed battlegrounds and Molvik.
battlegrounds | base | 17 18 19 20 33

# Hired companions, and the recruiters who sell them.
mercenaries | base | 6 40

# Dreaded seals as a currency.
seals | base | 2

# Trials of Atlantis: the zones, their population and the Hall of the Corrupt.
atlantis | base travel | 13 15 23 35 58 81

# The artifact system: scrolls, and the wiring that turns them into artifacts.
artifacts | base atlantis | 36 37

# The fifteen task dungeons, their masters, doors and populations.
#
# Depends on mercenaries, and this one is a compile-time dependency rather than
# a data one. TaskMaster.cs calls MercenaryManager.GetCompany to move the hires
# into the instance with their employer, and MercenaryTravel.cs is what closes
# the instance again afterwards. Every script in this repo compiles into one
# assembly, so taking the task dungeons without the mercenaries does not
# degrade -- it fails to build, and one bad file stops every script.
taskdungeons | base mercenaries | 66 67 68 80 82 83 93 94

# --------------------------------------------------------------- progression

# Champion levels: the trees, their spell lines and who may train them.
champion | base | 45 52 53 54 55 84

# The eight Master Level paths, their spells and their gaps.
#
# Depends on atlantis, and not for flavour. The Arbiter is what enrols a player
# on the path at all, and he is fixed in 35-atlantis-npcs.sql -- in stock
# OpenDAoC the only thing that sets MLGranted is the GM command /player startml.
# Demyphon, who sells Master Level credits for bounty points, is placed by 13
# and 35 as well. Without those you get the data and no way to reach it.
masterlevels | base atlantis | 12 39 42 43 44

# The realm ability tables for the classes that had none, and the frontier
# zones that let two thirds of the server earn a realm point at all -- without
# 119 this feature installs correctly and is unreachable in Albion and Midgard.
realmabilities | base | 73 74 119

# ------------------------------------------------------------------- classes

# The class data itself: spell lines, spells, line-to-spell mappings, combat
# styles and style procs, plus reopening the classes that were switched off.
#
# NOT separable per class. Migrations 46 and 89-92 are bulk imports carrying
# every expansion class at once, so there is no subset that is one class. The
# fixes below sit on top of this and each of those IS separable.
classdata | base champion masterlevels realmabilities | 46 59 75 76 79 85 86 87 88 89 90 91 92 95

# Individual class repairs, each installable on its own for testing.
warlock | classdata | 96 98 99 100
heretic | classdata | 101 102
# 115 clones Morynne, who is placed by 13-atlantis-mobs.sql.
bainshee | classdata atlantis | 103 115
# 111 clones Sudya, who is placed by 49-new-frontiers-population.sql.
valkyrie | classdata frontiers | 111
maulers | classdata | 106
vampiir | classdata | 109
animist | classdata | 114

# Realm Rank 5 abilities that were granted to nobody, or granted and never
# written: the Wizard's Wall of Flame and the Mentalist's Severing the Tether.
rr5 | classdata | 107 108 110

# Corrections that span classes rather than belonging to one: duplicate spell
# line rows, a hybrid line never marked as one, water breathing songs, the
# duplicated Resistance of the Ancients, and the three realm abilities every
# expansion class was missing.
classfixes | classdata | 47 105 112 113 118

# Everything above, which is what `classes` used to mean.
classes | classdata warlock heretic bainshee valkyrie maulers vampiir animist rr5 classfixes | -
