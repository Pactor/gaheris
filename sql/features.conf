# Which migrations belong to which feature.
#
# Read by install.sh. One record per line:
#
#     name | depends on | migration numbers
#
# Numbers are applied in numeric order regardless of how they are listed here,
# because order matters: the bulk imports at 46 and 89-92 overwrite anything
# earlier, so a correction numbered above them must run after them.
#
# Anything not listed in any feature is treated as part of `base`, so a new
# migration is applied by default rather than silently dropped. Add it to a
# feature only when it genuinely belongs to one.

# The co-operative conversion itself, the world fixes, and everything that has
# no meaning on its own. Every other feature depends on it.
base | - | 1 3 4 7 8 9 10 21 22 27 31 32 38 41 56 62 69 77 78 104 116 117

